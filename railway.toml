[build]
builder = "NIXPACKS"
buildCommand = "npm ci --prefix backend && npm --prefix backend run prisma:generate"

[deploy]
startCommand = "npm --prefix backend run prisma:deploy && npm --prefix backend start"
healthcheckPath = "/health"
healthcheckTimeout = 30
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
