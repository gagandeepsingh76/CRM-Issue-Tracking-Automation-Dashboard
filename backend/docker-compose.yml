services:
  postgres:
    image: postgres:16-alpine
    container_name: crm-dashboard-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: crm_dashboard
    ports:
      - "5432:5432"
    volumes:
      - crm-dashboard-postgres:/var/lib/postgresql/data

volumes:
  crm-dashboard-postgres:
