name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  frontend:
    name: Frontend lint, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run test
      - run: npm run build
        env:
          VITE_API_BASE_URL: http://localhost:5000/api/v1
          VITE_APP_NAME: CRM Suite

  backend:
    name: Backend lint, Prisma, integration tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: crm_dashboard_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d crm_dashboard_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/crm_dashboard_test?schema=public
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/crm_dashboard_test?schema=public
      JWT_SECRET: ci-test-secret-change-before-production
      CORS_ORIGIN: http://localhost:5173
      LOG_LEVEL: error
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci --prefix backend
      - run: npm --prefix backend run prisma:generate
      - run: npm --prefix backend run prisma:validate
      - run: npm --prefix backend run prisma:deploy
      - run: npm --prefix backend run lint
      - run: npm --prefix backend test
